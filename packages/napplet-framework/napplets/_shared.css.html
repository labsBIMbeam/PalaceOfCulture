<!--
  Shared styling every stub napplet inlines.

  A napplet is one self-contained file: it cannot link a stylesheet, because it
  has no origin to fetch one from. So this block is copied into each stub rather
  than referenced. Colours come from the --palace-* properties the prelude sets
  from the shell theme; the fallbacks only apply when a napplet is opened
  outside a shell.
-->
<style>
  :root {
    --palace-bg: #0a0705;
    --palace-fg: #efe6d2;
    --palace-primary: #e7b23c;
    --palace-muted: color-mix(in srgb, var(--palace-fg) 55%, var(--palace-bg));
    --palace-line: color-mix(in srgb, var(--palace-fg) 20%, var(--palace-bg));
    --palace-surface: color-mix(in srgb, var(--palace-fg) 7%, var(--palace-bg));
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--palace-bg);
    color: var(--palace-fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  body { padding: 8px; }
  h2 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--palace-muted);
  }
  button {
    font: inherit;
    color: inherit;
    background: var(--palace-surface);
    border: 1px solid var(--palace-line);
    border-radius: 6px;
    padding: 0 8px;
    min-height: 30px;
    cursor: pointer;
  }
  button[data-on="true"] {
    background: var(--palace-primary);
    border-color: var(--palace-primary);
    color: var(--palace-bg);
    font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--palace-muted); }
  .scroll { overflow-y: auto; max-height: 100%; }
  .denied { color: #e8735a; }
</style>
