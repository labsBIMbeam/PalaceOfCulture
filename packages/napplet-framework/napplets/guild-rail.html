<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guild rail</title>
<style>
  :root { --palace-bg:#0a0705; --palace-fg:#efe6d2; --palace-primary:#e7b23c;
    --palace-muted:color-mix(in srgb,var(--palace-fg) 55%,var(--palace-bg));
    --palace-line:color-mix(in srgb,var(--palace-fg) 20%,var(--palace-bg));
    --palace-surface:color-mix(in srgb,var(--palace-fg) 7%,var(--palace-bg)); }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--palace-bg);
    color:var(--palace-fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  body{padding:8px} h2{margin:0 0 6px;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--palace-muted)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  button{font:inherit;color:inherit;background:var(--palace-surface);
    border:1px solid var(--palace-line);border-radius:6px;padding:0 8px;min-height:34px;
    cursor:pointer;width:100%;text-align:left;display:flex;gap:6px;align-items:center}
  button[data-on="true"]{background:var(--palace-primary);border-color:var(--palace-primary);
    color:var(--palace-bg);font-weight:600}
  .badge{margin-left:auto;font-size:11px;opacity:.8}
</style>
</head>
<body>
<h2>Lens</h2>
<ul id="list"></ul>
<script>
// Guild rail — the lens is a global filter, never a page (ADR 0008). This panel
// only ever sends a setLens intent; what that filters is the shell's business.
const list = document.getElementById("list");

function render(state) {
  const rows = [
    { key: "commons", label: "Commons", lens: { kind: "commons" }, unread: 0 },
    { key: "union", label: "All joined", lens: { kind: "union" }, unread: 0 },
    ...state.guilds.map((g) => ({
      key: g.id,
      label: g.crest + "  " + g.name,
      lens: { kind: "guild", guildId: g.id },
      unread: g.unread,
    })),
  ];
  list.replaceChildren(...rows.map((row) => {
    const active =
      state.lens.kind === row.lens.kind &&
      (row.lens.kind !== "guild" || state.lens.guildId === row.lens.guildId);
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.textContent = row.label;
    button.dataset.on = String(active);
    if (row.unread > 0) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = String(row.unread);
      button.append(badge);
    }
    button.addEventListener("click", () => {
      window.palace.intent({ domain: "guild", action: "setLens", lens: row.lens });
      if (row.lens.kind === "guild") {
        window.palace.intent({ domain: "guild", action: "markRead", guildId: row.lens.guildId });
      }
    });
    li.append(button);
    return li;
  }));
}

window.palace.on("guild", render);
</script>
</body>
</html>
